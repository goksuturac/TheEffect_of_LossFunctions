paths:
  train_x: "./datasets/Data_a_CT_Img_in_Covid-19/TrainingSet/Imgs"
  train_y: "./datasets/Data_a_CT_Img_in_Covid-19/TrainingSet/LesionMasksJPG"
  test_x: "./datasets/Data_a_CT_Img_in_Covid-19/TestingSet/Imgs"
